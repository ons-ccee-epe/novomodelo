# Publish workspace crates to crates.io in dependency order.
#
# Triggered by version tags and manual dispatch. Requires a CARGO_REGISTRY_TOKEN
# secret in the "crates-io" GitHub environment.
#
# Each publish step tolerates "already exists" so the workflow is idempotent
# and can be safely re-run after partial failures.

name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Publish in dependency order so each crate is available when the next
      # one is submitted. The 30-second sleeps give the index time to propagate
      # before the next crate tries to resolve the previous one as a dependency.

      - name: Publish all crates
        shell: bash
        run: |
          # Retries on crates.io index-propagation lag: a freshly-published
          # dependency (e.g. novomodelo-stochastic) may not yet be visible to the
          # sparse index when a dependent crate (e.g. novomodelo-sddp) is published,
          # surfacing as "failed to select a version" / "no matching package".
          # The inter-layer sleeps below give the index a head start; this loop
          # is the safety net when that is not enough.
          publish() {
            local crate="$1"
            local output attempt=1
            local max_attempts=10
            echo "::group::Publishing $crate"
            while true; do
              if output=$(cargo publish -p "$crate" 2>&1); then
                echo "$output"
                echo "Published $crate successfully."
                break
              elif echo "$output" | grep -q "already exists"; then
                echo "$output"
                echo "Crate $crate already published, skipping."
                break
              elif echo "$output" | grep -qiE "failed to select a version|no matching package|not found in registry|failed to get .* as a dependency"; then
                echo "$output"
                if [[ "$attempt" -ge "$max_attempts" ]]; then
                  echo "::error::Failed to publish $crate after $attempt attempts (dependency not visible in the crates.io index)"
                  echo "::endgroup::"
                  return 1
                fi
                echo "Dependency not yet in the crates.io index; retrying $crate ($attempt/$max_attempts) in 30s..."
                sleep 30
                attempt=$((attempt + 1))
              else
                echo "$output"
                echo "::error::Failed to publish $crate"
                echo "::endgroup::"
                return 1
              fi
            done
            echo "::endgroup::"
          }

          # Layer 1: no intra-workspace dependencies
          publish novomodelo-core || exit 1
          sleep 30

          # Layer 2a: depends on novomodelo-core only
          publish novomodelo-stochastic || exit 1
          publish novomodelo-solver || exit 1
          publish novomodelo-comm || exit 1
          sleep 30

          # Layer 2b: depends on novomodelo-core + novomodelo-stochastic
          publish novomodelo-io || exit 1
          sleep 30

          # Layer 3: depends on infrastructure crates
          publish novomodelo-sddp || exit 1
          sleep 30

          # Layer 4: application crates (depend on novomodelo-sddp)
          publish novomodelo-cli || exit 1
          sleep 30

          # Layer 5: umbrella crate (depends on all of the above)
          # novomodelo-python is published to PyPI via maturin, not crates.io.
          publish novomodelo || exit 1

          echo "All crates published successfully."
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # GitHub Release creation and binary artifact distribution are handled
  # by cargo-dist in .github/workflows/v-release.yml.
