# Build platform-specific wheels and an sdist for the `novomodelo` Python package
# and publish them to PyPI.  Wheels contain the compiled Rust extension
# (PyO3/maturin) with the HiGHS LP solver statically linked; the sdist carries the
# workspace crates it depends on and the vendored solver sources.
#
# Platforms:  linux x86_64 (manylinux_2_34), linux aarch64 (manylinux_2_28),
#             linux musl x86_64, macOS x86_64/aarch64, Windows x86_64; each wheel
#             is tested on its own platform before publish
# Python:    3.12+ (single abi3 wheel per platform via PyO3 stable ABI)
#
# glibc floor: the manylinux_2_34 wheel needs glibc >= 2.34 (RHEL and Rocky
# Linux 9+, Ubuntu 22.04+, Debian 12+); on RHEL 8 and Ubuntu 20.04, below it, pip
# builds the sdist instead, which needs a Rust toolchain, cmake and a C++
# compiler. The aarch64 wheel needs glibc >= 2.28. Keep
# crates/novomodelo-python/README.md in step when the tag changes.
#
# Uses PyPI trusted publishing (OIDC) — no API tokens needed.
# Configure at: https://pypi.org/manage/project/novomodelo-python/settings/publishing/

name: Release Python

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # Build + test wheels across all platforms on PRs that touch the Python
  # bindings, so platform-specific failures (e.g. a Windows-only test) are
  # caught before a release tag rather than in the post-tag publish. The
  # publish job is gated to tag-push / workflow_dispatch, so PRs never publish.
  pull_request:
    paths:
      - "crates/novomodelo-python/**"
      - ".github/workflows/release-python.yml"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build wheels but do not publish to PyPI"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  # Build wheels for each platform/arch combination.
  build:
    name: wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux (glibc) ---
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_34"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          # --- Linux (musl) ---
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          # --- macOS ---
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          # --- Windows ---
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
          working-directory: crates/novomodelo-python
          before-script-linux: |
            # cmake is required for building HiGHS (vendored LP solver).
            # zlib is NOT needed — disabled via CMAKE_DISABLE_FIND_PACKAGE_ZLIB
            # in novomodelo-solver/build.rs.
            if command -v dnf &>/dev/null; then
              dnf install -y cmake
            elif command -v yum &>/dev/null; then
              yum install -y cmake3 || yum install -y cmake
            elif command -v apt-get &>/dev/null; then
              apt-get update && apt-get install -y cmake
            elif command -v apk &>/dev/null; then
              apk add --no-cache cmake make g++
            fi
            # Ensure Python 3.12+ is on PATH for abi3 wheel generation.
            # Manylinux containers ship multiple Pythons in /opt/python/.
            for pydir in /opt/python/cp313-cp313 /opt/python/cp312-cp312; do
              if [ -x "$pydir/bin/python3" ]; then
                export PATH="$pydir/bin:$PATH"
                break
              fi
            done

      # PEP 639 `license-files` cannot reference files above the project dir, and
      # the canonical license texts live at the repo root, so inject them into
      # each wheel's `.dist-info/licenses/` post-build (RECORD is recomputed).
      - name: Bundle license notices into wheels
        shell: bash
        run: |
          # manylinux wheels are built as root inside the maturin Docker
          # container, so the host runner (non-root) cannot rewrite them; reclaim
          # ownership on Linux before repacking. macOS/Windows build natively, so
          # this is a Linux-only no-op elsewhere ($RUNNER_OS is set by Actions).
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo chown -R "$(id -u):$(id -g)" crates/novomodelo-python/dist
          fi
          python -m pip install --quiet wheel
          python scripts/gen/inject_dist_licenses.py crates/novomodelo-python/dist \
            LICENSE NOTICE THIRD_PARTY_NOTICES.md crates/novomodelo-python/THIRD_PARTY_LICENSES.md

      - name: Probe the dgemm kernel of the wheels
        if: startsWith(matrix.target, 'x86_64-unknown-linux')
        run: bash scripts/ci/check-release-kernel.sh crates/novomodelo-python/dist/*.whl

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.target }}
          path: crates/novomodelo-python/dist/

  # The sdist, then the package built from it the way pip does where no wheel fits.
  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: crates/novomodelo-python

      - name: Bundle license notices into the sdist
        run: |
          python scripts/gen/inject_dist_licenses.py crates/novomodelo-python/dist \
            LICENSE NOTICE THIRD_PARTY_NOTICES.md

      - name: Install from the sdist and test
        run: |
          pip install crates/novomodelo-python/dist/*.tar.gz
          pip install pytest pyarrow numpy
          pytest crates/novomodelo-python/tests/ -v

      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: crates/novomodelo-python/dist/*.tar.gz
          if-no-files-found: error

  # The CLI the parity tests compare the wheel against. Built once on the host
  # runner and shared by the linux x86_64 test cells, rather than once per cell.
  cli:
    name: CLI (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-python-cli

      - run: cargo build --release -p novomodelo-cli

      - uses: actions/upload-artifact@v6
        with:
          name: cli-x86_64-unknown-linux-gnu
          path: target/release/novomodelo
          if-no-files-found: error

  # Smoke-test the built wheels on every target they are built for, across
  # Python versions. The linux x86_64 cells also run the CLI-vs-Python parity
  # modules, which skip without a CLI binary; --require-cli-binary makes a missing
  # one a failure. The musl wheel runs in an Alpine container, where pip selects
  # musllinux wheels for the test dependencies too.
  test:
    name: test (${{ matrix.target }}, py${{ matrix.python-version }})
    needs: [build, cli]
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: dist/

      - name: Run tests in Alpine
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          docker run --rm -v "$PWD:/w" -w /w python:${{ matrix.python-version }}-alpine sh -euc '
            pip install --no-index --find-links dist/ novomodelo-python
            pip install pytest pyarrow numpy
            pytest crates/novomodelo-python/tests/ -v'

      - uses: actions/setup-python@v6
        if: matrix.target != 'x86_64-unknown-linux-musl'
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install wheel and test dependencies
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: |
          pip install --no-index --find-links dist/ novomodelo-python
          pip install pytest pyarrow numpy

      - uses: actions/download-artifact@v7
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: cli-x86_64-unknown-linux-gnu
          path: target/release/

      - name: Run tests
        if: >-
          matrix.target != 'x86_64-unknown-linux-gnu'
          && matrix.target != 'x86_64-unknown-linux-musl'
        run: pytest crates/novomodelo-python/tests/ -v

      - name: Run tests with the CLI parity modules
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          chmod +x target/release/novomodelo
          pytest crates/novomodelo-python/tests/ -v --require-cli-binary

  # Publish all wheels and the sdist to PyPI.
  #
  # Runs on either a version tag push or an explicit workflow_dispatch
  # invocation (so we can recover from a transient build failure on the
  # tag-push run without needing to retag). The dry-run input still
  # short-circuits to skip in either case.
  publish:
    name: Publish to PyPI
    needs: [build, test, sdist]
    if: >-
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
      && !(github.event.inputs.dry-run == 'true')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: "wheels-*"
          merge-multiple: true
          path: dist/

      - uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist/

      - name: List artifacts
        run: ls -lh dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
