[workspace]
members = ["cargo:crates/novomodelo-cli"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Include changelog in release notes
changelog = true
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Third-party attribution bundled into every CLI archive, alongside the
# auto-included LICENSE and README — the statically-linked binary carries its
# dependencies' notices with it. Paths are relative to the workspace root. This
# is consumed by `dist build` at release time and does not change the generated
# release.yml, so no `dist generate` re-run is required.
include = [
    "NOTICE",
    "THIRD_PARTY_NOTICES.md",
    "THIRD_PARTY_LICENSES.md",
]
