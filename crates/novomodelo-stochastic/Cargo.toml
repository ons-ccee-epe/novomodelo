[package]
name = "cobre-stochastic"
description = "Stochastic process models for power systems — PAR(p), scenario generation, correlated sampling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["stochastic", "time-series", "autoregressive", "scenarios", "sampling"]
categories = ["science", "simulation", "mathematics"]

[features]
## Opt-in to the slow test suite (no slow tests currently in this crate;
## declaration reserved for workspace consistency).
slow-tests = []
## Expose crate-internal test fixtures to other crates' tests and to this
## crate's `tests/` binaries.
##
## The shared `test_support` builders are gated on
## `#[cfg(any(test, feature = "test-support"))]`, so plain `cargo test` sees
## them via `test` and downstream integration tests see them via this feature.
## Must NOT be enabled in production builds.
test-support = ["cobre-core/test-support"]

[dependencies]
cobre-core = { version = "0.18.0", path = "../cobre-core" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
siphasher = "1"
rand = "0.10"
rand_distr = "0.6"
rand_pcg = "0.10"
rayon = { workspace = true }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
chrono = "0.4"
cobre-core = { version = "0.18.0", path = "../cobre-core", features = ["test-support"] }
cobre-stochastic = { path = ".", features = ["test-support"] }
proptest = "1"

[lints]
workspace = true
