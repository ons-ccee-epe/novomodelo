[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "novomodelo-python"
dynamic = ["version"]
description = "High-performance SDDP solver for hydrothermal dispatch — Python bindings for the Novomodelo ecosystem"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Operador Nacional do Sistema Elétrico - ONS" },
    { name = "Câmara de Comercialização de Energia Elétrica - CCEE" },
    { name = "Empresa de Pesquisa Energética - EPE" },
]
readme = "README.md"
keywords = ["sddp", "optimization", "power-systems", "energy", "hydrothermal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://docs.modelossetoreletrico.org.br/"
Repository = "https://github.com/ons-ccee-epe/novomodelo"
Documentation = "https://docs.modelossetoreletrico.org.br/"
"Bug Tracker" = "https://github.com/ons-ccee-epe/novomodelo/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "novomodelo._native"
python-source = "python"

[tool.pyright]
venvPath = "../.."
venv = ".venv"
pythonVersion = "3.12"
include = ["tests"]
reportMissingTypeStubs = "none"
reportMissingModuleSource = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# PGH forbids a blanket `# noqa` / `# type: ignore`; RUF100 drops a suppression that
# suppresses nothing. PLW1514 (open/read_text/write_text without `encoding`) only
# exists in preview, so `explicit-preview-rules` enables it and no other preview rule.
select = ["E", "F", "I", "B", "UP", "PGH", "RUF100", "PLW1514"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.isort]
# `novomodelo._native` is a compiled module, so ruff cannot find it on disk and would
# otherwise file it as third-party.
known-first-party = ["novomodelo", "_novomodelo_cli"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps at 88; E501 catches only what it cannot wrap.
max-line-length = 110
